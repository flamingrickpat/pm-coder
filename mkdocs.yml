site_name: pm-coder decision client
site_url: ""
use_directory_urls: false
theme:
  name: material
  font: false
plugins:
  - search
  - gen-files:
      scripts: [scripts/gen_reference.py]
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            docstring_style: null
nav:
  - Overview: index.md
  - Requests and receipts: decisions/requests.md
  - Failure and cancellation: decisions/failures.md
  - Operation and limits: decisions/operation.md
  - MCP request timeouts: mcp-timeouts.md
  - API reference: reference/
